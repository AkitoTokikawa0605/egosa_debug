<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>魔界検索ツール</title>

<!-- アイコン設定 -->
<link rel="icon" href="images/icon_2.png">
<link rel="apple-touch-icon" href="images/icon_2.png">

<!-- スマホ用 -->
<meta name="theme-color" content="#6a0dad">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
body {
  margin: 0;
  font-family: sans-serif;

  background-image: url("images/gazou6.jpg");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  color: white;
  position: relative;
  z-index: 0;
}

/* 背景暗く＋ぼかし */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(3px);
  z-index: -1;
}

/* ヘッダー */
.header h1 {
  font-size: 50px;
  text-align: center;
  margin-top: 30px;
  text-shadow: 0 0 15px rgba(255,255,255,0.3);
}

/* コンテナ */
.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
  padding: 20px;
}

.desc {
  background: rgba(0,0,0,0.45);
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  max-width: 500px;
}

.section-title {
  font-size: 28px;
  font-weight: bold;
}

.guide-btn {
  background: linear-gradient(45deg,#b56cff,#ff7ac3);
  color: white;
  padding: 12px 25px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

/* ボックス */
.box {
  background: rgba(80,80,80,0.75);
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  width: 100%;
  max-width: 400px;
}

/* ボタン */
button {
  margin: 5px;
  padding: 10px 15px;
  border-radius: 10px;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

.pink { background: #ff7ac3; }
.yellow { background: #ffd700; }
.blue { background: #6ecbff; }

/* カレンダー */
.calendar-box {
  background: rgba(55,55,55,0.88);
  width: 95%;
  max-width: 340px;
  padding: 14px;
  border-radius: 20px;
  text-align: center;
}

/* メンテ */
#maintenance {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.maintenance-box {
  background: rgba(0,0,0,0.6);
  padding: 40px;
  border-radius: 20px;
  text-align: center;
}

.maintenance-img {
  width: 220px;
  animation: float 2s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0); }
}
</style>
</head>

<body>

<!-- メンテナンス -->
<div id="maintenance">
  <div class="maintenance-box">
    <img src="images/ment.png" class="maintenance-img">
    <h1>現在メンテナンス中</h1>
    <p>現在アップデート作業中です。<br>しばらくお待ちください。</p>
  </div>
</div>

<div class="header">
  <h1>魔界検索ツール</h1>
</div>

<div class="container">

  <div class="desc">
    魔界検索ツールは
    <b style="color:#ff7ac3;">魔灰えん</b>
    さんを推す為のツールです！
  </div>

  <button class="guide-btn" onclick="location.href='setumei.html'">
    取扱説明書
  </button>

  <input type="date" id="date">

  <!-- 魔灰えん -->
  <div class="box">
    <h2>魔灰えん</h2>

    <div>
      <label><input type="radio" name="mode1" value="or" checked> OR</label>
      <label><input type="radio" name="mode1" value="exact"> 完全一致</label>
    </div>

    <button class="pink" onclick="searchX('魔灰えん','mode1')">X検索</button>
    <button class="yellow" onclick="searchYahoo('魔灰えん')">Yahoo</button>
    <button class="blue" onclick="searchDate('魔灰えん')">日付</button>
    <button class="pink" onclick="postX('魔灰えん')">ポスト</button>
  </div>

  <!-- 魔灰絵 -->
  <div class="box">
    <h2>魔灰絵</h2>

    <div>
      <label><input type="radio" name="mode2" value="or" checked> OR</label>
      <label><input type="radio" name="mode2" value="exact"> 完全一致</label>
    </div>

    <button class="pink" onclick="searchX('魔灰絵','mode2')">X検索</button>
    <button class="yellow" onclick="searchYahoo('魔灰絵')">Yahoo</button>
    <button class="blue" onclick="searchDate('魔灰絵')">日付</button>
    <button class="pink" onclick="postX('魔灰絵')">ポスト</button>
  </div>

  <!-- 新衣装 -->
  <div class="box">
    <h2>魔灰えん新衣装お披露目会</h2>

    <div>
      <label><input type="radio" name="mode3" value="or" checked> OR</label>
      <label><input type="radio" name="mode3" value="exact"> 完全一致</label>
    </div>

    <button class="pink" onclick="searchX('魔灰えん新衣装お披露目会','mode3')">X検索</button>
    <button class="yellow" onclick="searchYahoo('魔灰えん新衣装お披露目会')">Yahoo</button>
    <button class="blue" onclick="searchDate('魔灰えん新衣装お披露目会')">日付</button>
    <button class="pink" onclick="postX('魔灰えん新衣装お披露目会')">ポスト</button>
  </div>

  <!-- フリー素材 -->
  <div class="box">
    <h2>魔灰えんフリー素材集</h2>

    <div>
      <label><input type="radio" name="mode4" value="or" checked> OR</label>
      <label><input type="radio" name="mode4" value="exact"> 完全一致</label>
    </div>

    <button class="pink" onclick="searchX('魔灰えんフリー素材集','mode4')">X検索</button>
    <button class="yellow" onclick="searchYahoo('魔灰えんフリー素材集')">Yahoo</button>
    <button class="blue" onclick="searchDate('魔灰えんフリー素材集')">日付</button>
    <button class="pink" onclick="postX('魔灰えんフリー素材集')">ポスト</button>
  </div>

  <!-- カレンダー -->
  <div class="calendar-box">
    <h2>魔灰えん スケジュール</h2>

    <iframe
      src="https://calendar.google.com/calendar/embed?src=afeb120713660b235cfb63c258081979b1a04fb6fc873aea78c6741550065aa6%40group.calendar.google.com&ctz=Asia%2FTokyo"
      style="border:0;width:100%;height:320px;border-radius:15px;background:white;"
      frameborder="0"
      scrolling="no">
    </iframe>
  </div>

</div>

<script>

// メンテ
let maintenanceMode = false;

const isDev = new URLSearchParams(location.search).get("dev") === "1";

if (maintenanceMode && !isDev) {
  document.getElementById("maintenance").style.display = "flex";
}

// X検索
function searchX(word, group){
  const mode = document.querySelector(`input[name="${group}"]:checked`).value;

  const query = mode === "or"
    ? `${word} OR #${word}`
    : `"${word}" OR "#${word}"`;

  window.open(`https://x.com/search?q=${encodeURIComponent(query)}&f=live`);
}

// Yahoo
function searchYahoo(word){
  window.open(`https://search.yahoo.co.jp/realtime/search?p=${encodeURIComponent(word)}`);
}

// 日付
function searchDate(word){
  const date = document.getElementById("date").value;
  if(!date){ alert("日付選んで！"); return; }

  const d = new Date(date);
  d.setDate(d.getDate()+1);
  const until = d.toISOString().split("T")[0];

  const query = `${word} since:${date} until:${until}`;

  window.open(`https://x.com/search?q=${encodeURIComponent(query)}&f=live`);
}

// ポスト
function postX(word){
  window.open(`https://x.com/intent/tweet?text=${encodeURIComponent("#"+word)}`);
}

</script>

</body>
</html>
