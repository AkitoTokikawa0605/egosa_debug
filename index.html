<script>

/* trueでメンテON / falseで通常 */
const maintenanceMode = true;

/* 開発者モード貫通 */
const urlParams = new URLSearchParams(location.search);

const isDev =
  urlParams.get("dev") === "1";

/* メンテ表示 */
if(maintenanceMode && !isDev){

  document.getElementById(
    "maintenance"
  ).style.display = "flex";

  document.body.style.overflow = "hidden";
}

function searchX(word, group){

  const mode =
    document.querySelector(
      `input[name="${group}"]:checked`
    ).value;

  const query =
    mode === "or"
    ? `${word} OR #${word}`
    : `"${word}" OR "#${word}"`;

  window.open(
    `https://x.com/search?q=${encodeURIComponent(query)}&f=live`
  );
}

function searchYahoo(word){

  window.open(
    `https://search.yahoo.co.jp/realtime/search?p=${encodeURIComponent(word)}`
  );
}

function searchDate(word){

  const date =
    document.getElementById("date").value;

  if(!date){
    alert("日付選んで！");
    return;
  }

  const d = new Date(date);

  d.setDate(d.getDate() + 1);

  const until =
    d.toISOString().split("T")[0];

  const query =
    `${word} since:${date} until:${until}`;

  window.open(
    `https://x.com/search?q=${encodeURIComponent(query)}&f=live`
  );
}

function postX(word){

  const text = `#${word}`;

  const url =
    `https://x.com/intent/tweet?text=${encodeURIComponent(text)}`;

  window.open(url, "_blank");
}

</script>
