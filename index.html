<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>魔界検索ツール</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6a0dad">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg1: #241133;
      --bg2: #3a1f52;
      --bg3: #170b24;
      --text: #fff7ff;
      --sub: #e8d6ff;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 162, 244, 0.18), transparent 22%),
        radial-gradient(circle at 80% 25%, rgba(123, 201, 255, 0.18), transparent 24%),
        radial-gradient(circle at 50% 80%, rgba(212, 126, 255, 0.12), transparent 30%),
        linear-gradient(160deg, var(--bg1), var(--bg2) 48%, var(--bg3));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* キラキラ背景 */
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.6) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,192,255,0.55) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(173,225,255,0.5) 0 1px, transparent 1.5px);
      background-size: 180px 180px, 240px 240px, 300px 300px;
      background-position: 10% 20%, 70% 30%, 40% 80%;
      opacity: 0.6;
    }

    body::after {
      backdrop-filter: blur(2px);
      background: rgba(0, 0, 0, 0.12);
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 980px);
      text-align: center;
    }

    .title {
      margin: 0 0 12px;
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-shadow:
        0 0 12px rgba(255, 144, 229, 0.45),
        0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .lead {
      margin: 0 auto 28px;
      max-width: 680px;
      color: var(--sub);
      font-size: clamp(13px, 2vw, 16px);
      line-height: 1.8;
    }

    /*
      元画像(1024x576想定)の中央検索窓だけを見せるためのクロップエリア
    */
    .magic-search {
      position: relative;
      width: min(92vw, 860px);
      margin: 0 auto;
      aspect-ratio: 1024 / 285;
      overflow: hidden;
      border-radius: 28px;
      filter: drop-shadow(0 18px 35px rgba(0, 0, 0, 0.28));
    }

    .magic-search img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      transform: translateY(-145px);
    }

    /*
      実際に使うフォームUI
      背景は透明にして、元画像の検索窓デザインを見せる
    */
    .search-form {
      position: absolute;
      inset: 0;
    }

    .search-input {
      position: absolute;
      left: 23.8%;
      top: 35.5%;
      width: 41.2%;
      height: 20.5%;
      border: none;
      outline: none;
      background: transparent;
      color: #6a4b7a;
      font-size: clamp(15px, 2.2vw, 26px);
      font-weight: 700;
      line-height: 1;
      padding: 0 12px;
      text-align: left;
    }

    .search-input::placeholder {
      color: transparent;
    }

    .search-button {
      position: absolute;
      left: 67.3%;
      top: 33.5%;
      width: 14.8%;
      height: 24%;
      border: none;
      outline: none;
      background: transparent;
      cursor: pointer;
      color: transparent;
      border-radius: 999px;
    }

    .search-button:focus-visible,
    .search-input:focus-visible {
      box-shadow: 0 0 0 3px rgba(138, 220, 255, 0.85);
      border-radius: 16px;
    }

    .tips {
      margin-top: 22px;
      color: #f4dcff;
      font-size: clamp(12px, 1.8vw, 14px);
      opacity: 0.92;
      line-height: 1.8;
    }

    .tips code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 999px;
      font-family: inherit;
    }

    @media (max-width: 700px) {
      .magic-search {
        width: 96vw;
        aspect-ratio: 1024 / 300;
        border-radius: 20px;
      }

      .magic-search img {
        transform: translateY(-128px);
      }

      .search-input {
        left: 23.5%;
        top: 35.2%;
        width: 41.8%;
        height: 20.5%;
        padding: 0 8px;
      }

      .search-button {
        left: 67.2%;
        top: 33.2%;
        width: 15.2%;
        height: 24.8%;
      }
    }

    @media (max-width: 480px) {
      .magic-search {
        aspect-ratio: 1024 / 320;
      }

      .magic-search img {
        transform: translateY(-118px);
      }

      .search-input {
        font-size: 14px;
        left: 23%;
        width: 42.5%;
      }

      .search-button {
        left: 67%;
        width: 15.5%;
      }
    }
  </style>
</head>
<body>

  <main class="app">
    <h1 class="title">魔界検索ツール</h1>
    <p class="lead">
      画像の中にある検索窓だけを使う形にした完成版です。<br>
      入力して <strong>検索</strong> ボタン、または <strong>Enter</strong> で X のライブ検索を開きます。
    </p>

    <section class="magic-search" aria-label="魔界検索窓">
      <img
        src="https://www.genspark.ai/api/files/s/Kqwvn2j7"
        alt="魔界検索ツールの検索窓デザイン"
      >

      <form class="search-form" onsubmit="searchMagic(event)">
        <input
          type="text"
          id="magicKeyword"
          class="search-input"
          aria-label="検索ワード"
          autocomplete="off"
          spellcheck="false"
        >
        <button
          type="submit"
          class="search-button"
          aria-label="検索する"
          title="検索する"
        >
          検索
        </button>
      </form>
    </section>

    <div class="tips">
      検索内容は <code>キーワード OR #キーワード</code> の形で X 検索します。
    </div>
  </main>

  <script>
    function searchMagic(event) {
      event.preventDefault();

      const input = document.getElementById("magicKeyword");
      const word = input.value.trim();

      if (!word) {
        alert("検索ワードを入力してね！");
        input.focus();
        return;
      }

      const query = `${word} OR #${word}`;
      const url = `https://x.com/search?q=${encodeURIComponent(query)}&f=live`;

      window.open(url, "_blank", "noopener");
    }
  </script>

</body>
</html>
