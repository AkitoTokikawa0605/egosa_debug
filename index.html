<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>魔界検索ツール</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;

  /* デフォルト背景（あとでJSで上書きされる） */
  background: url("images/gazou6.jpg") no-repeat center center fixed;
  background-size: cover;

  color: white;
  position: relative;
  text-align: center;
}

/* 背景を薄くする */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.25);
  z-index: -1;
}

/* UI */
.header h1 {
  font-size: 50px;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
  padding: 20px;
}

.desc {
  background: rgba(0,0,0,0.4);
  padding: 15px;
  border-radius: 12px;
}

.box {
  background: rgba(100,100,100,0.75);
  padding: 20px;
  border-radius: 15px;
  width: 100%;
  max-width: 400px;
}

button {
  margin: 5px;
  padding: 10px 15px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.pink { background: #ff7ac3; }
.yellow { background: #ffd700; }
.blue { background: #6ecbff; }

/* 背景変更UI */
.bg-control {
  margin-top: 20px;
}

.bg-control input {
  padding: 10px;
  border-radius: 10px;
  width: 80%;
  max-width: 300px;
}
</style>
</head>

<body>

<div class="header">
  <h1>魔界検索ツール</h1>
</div>

<!-- 背景変更 -->
<div class="bg-control">
  <p>背景画像URLを入れると変更できます</p>
  <input type="text" id="bgInput" placeholder="images/bg.jpg など">
  <button onclick="changeBg()">変更</button>
</div>

<div class="container">

  <div class="desc">
    魔界検索ツールは魔灰えんさんを推す為のツールです！
  </div>

  <div class="box">
    <h2>魔灰えん</h2>
    <button class="pink" onclick="searchX('魔灰えん','mode1')">X検索</button>
    <button class="yellow" onclick="searchYahoo('魔灰えん')">Yahoo</button>
  </div>

</div>

<script>
/* 背景変更 */
function changeBg(){
  const url = document.getElementById("bgInput").value;
  if(!url) return alert("画像URL入れて！");

  document.body.style.backgroundImage = `url('${url}')`;
}

/* X検索 */
function searchX(word){
  const query = `${word}`;
  window.open(`https://x.com/search?q=${encodeURIComponent(query)}&f=live`);
}

/* Yahoo */
function searchYahoo(word){
  window.open(`https://search.yahoo.co.jp/realtime/search?p=${encodeURIComponent(word)}`);
}
</script>

</body>
</html>
