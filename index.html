<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>魔界検索ツール</title>
  
  <link rel="icon" href="images/icon_3.png">
  <link rel="apple-touch-icon" href="images/icon_3.png">
  <meta name="theme-color" content="#6a0dad">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: sans-serif;
      background-image: url("images/haikei2.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
      position: relative;
      z-index: 0;
    }

    /* 背景の透過レイヤー */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(3px);
      z-index: -1;
    }

    /* ヘッダーロゴ */
    .header {
      text-align: center;
      margin-top: 30px;
      margin-bottom: 10px;
      padding: 10px;
    }

    .header-logo {
      max-width: 400px;
      width: 90%;
      height: auto;
      filter: drop-shadow(0 0 10px rgba(106, 13, 173, 0.7));
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      padding: 20px;
    }

    .desc {
      background: rgba(0,0,0,0.45);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }

    .section-title {
      font-size: 26px;
      font-weight: bold;
      margin: 10px 0;
    }

    /* ボタン共通スタイル */
    .btn-common {
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
      transition: 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .btn-common:hover { transform: scale(1.05); }

    /* ボタン横並び用のボックス */
    .btn-group {
      display: flex;
      gap: 15px;
      width: 100%;
      max-width: 400px;
    }
    /* 横並びの時はボタンを少し小さく（文字サイズ調整＆幅を均等に） */
    .btn-group .btn-common {
      flex: 1;
      padding: 12px 10px;
      font-size: 14px;
    }

    .reload-inline-btn { background: linear-gradient(45deg, #6a0dad, #b56cff); }
    .share-btn { background: linear-gradient(45deg, #ff7ac3, #6a0dad); } /* 共有ボタン用のグラデーション */
    .guide-btn { background: linear-gradient(45deg,#b56cff,#ff7ac3); width: 100%; max-width: 400px; }

    /* 検索ボックス */
    .box {
      background: rgba(80,80,80,0.75);
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      border: 2px solid #6a0dad; /* すべてのボックスに紫色の縁を追加 */
    }

    .box h2 { margin-top: 0; font-size: 20px; }

    /* ボックス内ボタンの2×2グリッド配置設定 */
    .box-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 2列に均等分割 */
      gap: 10px;                     /* ボタン同士の間隔 */
      margin-top: 5px;
    }

    .box button {
      margin: 0; /* グリッド化に伴いmarginをリセット */
      padding: 10px 15px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      width: 100%; /* 横幅いっぱいに広げる */
    }
    .box button:hover { transform: scale(1.02); }

    .pink { background: #ff7ac3; color: black; }
    .yellow { background: #ffd700; color: black; }
    .blue { background: #6ecbff; color: black; }

    .mode {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 12px;
    }
    .mode label { cursor: pointer; display: flex; align-items: center; gap: 5px; }

    /* ボックス内埋め込み用 日付検索のスタイル変更 */
    .box-date-container {
      margin-bottom: 12px;
    }
    
    /* 日付選択の文字を出すための新しいスタイル設定 */
    input[type="date"] {
      position: relative;
      padding: 6px 10px;
      border-radius: 8px;
      border: none;
      width: 180px;
      font-size: 14px;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
    }

    /* 未選択（値が空白）の時だけ「日付選択」という文字を重ねて表示する魔法のCSS */
    input[type="date"]:invalid::before {
      content: "日付選択";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.9);
      color: #666;
      border-radius: 8px;
      pointer-events: none;
    }

    /* 自由検索入力欄のスタイル */
    .search-input {
      width: 90%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      margin-bottom: 15px;
      text-align: center;
    }

    /* スケジュールエリア */
    .calendar-box {
      background: rgba(55,55,55,0.88);
      width: 100%;
      max-width: 600px;
      padding: 10px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(140,0,255,0.2);
    }

    .calendar-iframe {
      border: 0;
      width: 100%;
      max-width: 600px;
      height: 250px;
      border-radius: 15px;
      background: white;
    }

    /* フッター */
    .footer {
      text-align: center;
      padding: 20px;
      background: rgba(0,0,0,0.5);
      margin-top: 30px;
    }

    .icons {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-bottom: 15px;
    }

    .icons img {
      width: 35px;
      filter: invert(1);
      transition: 0.2s;
    }
    .icons img:hover { transform: scale(1.2); }

    .footer a {
      color: #6ecbff;
      text-decoration: none;
      font-weight: bold;
    }
    .footer a:hover { text-decoration: underline; }

    /* メンテナンス画面 */
    #maintenance {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url("images/gazou6.jpg");
      background-size: cover;
      background-position: center;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .maintenance-box {
      background: rgba(0,0,0,0.6);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    .maintenance-logo {
      width: 250px;
      max-width: 80%;
      height: auto;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 10px rgba(255, 122, 195, 0.7));
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>

<script>
// --- 管理設定 ---
let maintenanceMode = false; 

const isDev = new URLSearchParams(location.search).get("dev") === "1";
if (maintenanceMode && !isDev) {
  document.getElementById("maintenance").style.display = "flex";
  document.body.style.overflow = "hidden";
}

/* --- X共有用関数 --- */
function shareOnX() {
  // ハッシュタグに #VTuber を追加しました
  const text = "魔灰えんさんを推すための「魔界検索ツール」が便利すぎる！🔥\n#魔灰えん #VTuber";
  const url = location.href; 
  window.open(`https://x.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, "_blank");
}

/* --- 自由検索用の関数 --- */
function searchFreeX() {
  const word = document.getElementById("free-keyword").value.trim();
  if(!word) { alert("検索ワードを入力してね！"); return; }
  const query = `${word} OR #${word}`;
  window.open(`https://x.com/search?q=${encodeURIComponent(query)}&f=live`, "_blank");
}

function searchFreeYahoo() {
  const word = document.getElementById("free-keyword").value.trim();
  if(!word) { alert("検索ワードを入力してね！"); return; }
  window.open(`https://search.yahoo.co.jp/realtime/search?p=${encodeURIComponent(word)}`, "_blank");
}

function searchDateFree() {
  const word = document.getElementById("free-keyword").value.trim();
  if(!word) { alert("検索ワードを入力してね！"); return; }
  
  const dateInput = document.getElementById("date_free").value;
  if(!dateInput){ alert("日付を選んでね！"); return; }
  
  const d = new Date(dateInput);
  const since = dateInput; 
  d.setDate(d.getDate() + 1);
  const until = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  const query = `${word} since:${since} until:${until}`;
  window.open(`https://x.com/search?q=${encodeURIComponent(query)}&f=live`, "_blank");
}

// --- 既存の検索関数 ---
function searchX(word, group){

  const mode = document.querySelector(
    `input[name="${group}"]:checked`
  ).value;

  let query = "";

  // 普通検索（#のみ）
  if(mode === "normal"){
    query = `#${word}`;
  }

  // OR検索
  else if(mode === "or"){
    query = `${word} OR #${word}`;
  }

  // 完全一致
  else if(mode === "exact"){
    query = `"${word}" OR "#${word}"`;
  }
  
console.log(mode); // ←確認用
  
  window.open(
    `https://x.com/search?q=${encodeURIComponent(query)}&f=live`,
    "_blank"
  );
}

function searchDate(word, inputId){
  const dateInput = document.getElementById(inputId).value;
  if(!dateInput){ alert("日付を選んでね！"); return; }
  const d = new Date(dateInput);
  const since = dateInput; 
  d.setDate(d.getDate() + 1);
  const until = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  const query = `${word} since:${since} until:${until}`;
  window.open(`https://x.com/search?q=${encodeURIComponent(query)}&f=live`, "_blank");
}

function postX(word){
  const text = `#${word}`;
  window.open(`https://x.com/intent/tweet?text=${encodeURIComponent(text)}`, "_blank");
}
</script>
