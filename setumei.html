<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>使い方</title>

<style>
body {
  background: #111;
  color: white;
  text-align: center;
  font-family: sans-serif;
  padding: 20px;
}

/* 画像 */
.setumei-img {
  width: 90%;
  max-width: 600px;
  border-radius: 10px;
  margin: 40px 0;
}

p {
  margin-bottom: 10px;
}

/* ボタン */
button {
  padding: 10px 20px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}
</style>

</head>
<body>

<h1>使い方</h1>

<p>① ここのボタンを押せばXで検索が可能になります<br>
　　 「OR」か「完全一致」のどちらかを選択して検索も出来ます。</p>

<img src="images/gazou1.png" class="setumei-img">
</p>
  
<p>① ここのボタンを押せばYahoo!リアルタイムで検索が可能になります<br>
　　 「OR」か「完全一致」のどちらかを選択して検索も出来ます。</p>

<img src="images/gazou2.png" class="setumeie-img">
</p>
  
<p>① 日付（ピンクの手）の場所に〇〇年〇〇月〇〇日と記載して<br>
 　  日付を押すと指定した日付のポストを検索が出来ます。

<img src="images/gazou3.png" class="setumeie-img">
</p>
  
  <p>① 「ポスト」をクリックするとXが開き <br>
  　　　「ハッシュタグ」のみの新規ポストになります。

<img src="images/gazou4.png" class="setumeie-img">
</p>
</p>
<img src="images/gazou5.png" class="setumeie-img">
</p>
