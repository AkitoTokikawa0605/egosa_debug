<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>使い方</title>

<style>
body {
  background: #111;
  color: white;
  text-align: center;
  font-family: sans-serif;
  padding: 20px;
}

/* 画像 */
.guide-img {
  width: 90%;
  max-width: 600px;
  border-radius: 10px;
  margin: 20px 0;
}

  padding: 10px 20px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}
</style>

</head>
<body>

<h1>使い方</h1>

<p>① ボタンを押して検索できます</p>

<img src="images/guide1.jpg" class="guide-img">

<p>② 日付検索も可能です</p>

<img src="images/guide2.jpg" class="guide-img">

<br>

<button onclick="history.back()">← 戻る</button>

</body>
</html>
